<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Services & Infrastructure — Dalkhola Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/directory.css">
  <script src="/js/shared/header.js" defer></script>
  <script src="/js/shared/footer.js" defer></script>
  <style>
    /* Card Image Specific Styling */
    .snap-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 0.75rem;
    }

    .badge-pill {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--teal-ink);
      color: var(--teal);
    }

    /* Services page card layout */
    .services-card-grid,
    .bento {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 20px;
      align-items: stretch;
    }

    /* Manual and automated cards */
    .bento>.snap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px;
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .bento>.snap:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.10);
    }

    .bento>.snap h3 {
      margin: 12px 0;
    }

    .snap-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .badge-pill {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--teal-ink, #e0f2f1);
      color: var(--teal, #087e75);
    }

    /* Combined healthcare card */
    .healthcare-combined {
      grid-column: 1 / -1;
    }

    .healthcare-facility {
      padding: 16px 0;
    }

    .healthcare-facility+.healthcare-facility {
      border-top: 1px solid var(--border, #e5e7eb);
    }

    .healthcare-facility h4 {
      margin: 10px 0;
    }

    /* Expandable automated categories */
    .service-accordion {
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 18px;
      background: var(--surface, #ffffff);
      overflow: hidden;
    }

    .service-accordion-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 22px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      list-style: none;
    }

    .service-accordion-summary::-webkit-details-marker {
      display: none;
    }

    .service-accordion-summary::after {
      content: "+";
      font-size: 1.4rem;
    }

    .service-accordion[open] .service-accordion-summary::after {
      content: "−";
    }

    .service-count {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.7;
    }

    .service-accordion-content {
      padding: 20px;
      border-top: 1px solid var(--border, #e5e7eb);
    }

    .service-accordion-content>.snap {
      min-width: 0;
    }

    .service-status {
      font-weight: 700;
      color: #b45309;
    }

    .last-updated {
      margin: 24px 0;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .bento {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .bento>.snap {
        padding: 16px;
      }

      .service-accordion-summary {
        padding: 16px;
      }
    }

    /* Fix service card text visibility */
    .bento>.snap,
    .healthcare-combined,
    .healthcare-facility,
    .service-accordion-content {
      color: #1f2937;
    }

    .bento>.snap h2,
    .bento>.snap h3,
    .bento>.snap h4,
    .healthcare-combined h2,
    .healthcare-combined h3,
    .healthcare-facility h3,
    .service-accordion-content h2,
    .service-accordion-content h3,
    .service-accordion-content h4 {
      color: #111827;
    }

    .bento>.snap p,
    .bento>.snap li,
    .healthcare-combined p,
    .healthcare-facility p,
    .service-accordion-content p,
    .service-accordion-content li {
      color: #374151;
    }

    .service-accordion-summary {
      color: #111827;
    }

    .service-count,
    .service-status,
    .last-updated {
      color: #4b5563;
    }

    /* ----------  */

    .services-hero {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) minmax(0, 42%);
      align-items: center;
      gap: 32px;
      padding: 28px;
      overflow: hidden;
    }

    .services-hero-text {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .services-hero-text h1 {
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.2;
      margin: 0 0 16px;
      overflow-wrap: break-word;
    }

    .services-hero-text .lead {
      font-size: 16px;
      line-height: 1.7;
      overflow-wrap: break-word;
    }

    .services-hero-image {
      min-width: 0;
      width: 100%;
    }

    .services-hero-image img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 16px;
    }

    @media (max-width: 700px) {
      .services-hero {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 18px;
      }
    }

    /* Full-width images for all manual service cards */
    .bento>.snap img,
    .healthcare-combined img,
    .healthcare-facility img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
    }

    /* Ensure manual cards use the available width */
    .bento>.snap,
    .healthcare-combined {
      width: 100%;
      min-width: 0;
    }

    .bento>.snap .snap-img,
    .healthcare-combined .snap-img {
      width: 100%;
      overflow: hidden;
    }
  </style>
  <!-- SHARED-FAVICON:START -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="dalkhola-favicon.png">
  <!-- SHARED-FAVICON:END -->



</head>

<body>


  <main class="wrap">
    <section class="hero services-hero">
      <div class="services-hero-text">
        <h1>Public Services</h1>
        <p class="lead">
          Essential healthcare, civic administration, banking, accommodation,
          diagnostic centres, pharmacies and postal services in Dalkhola.
        </p>
      </div>

      <div class="services-hero-image">
        <img src="https://res.cloudinary.com/m8ojhenk/image/upload/v1794335252/Dalkhola_Public_Services_Banner.png"
          alt="Public Services in Dalkhola">
      </div>
    </section>
  </main>


  <script src="/js/pages/services-page.js" defer></script>
</body>

</html>
