<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transport & Connectivity | Dalkhola Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8FA; --surface:#FFFFFF; --ink:#12202B; --muted:#55656F; --line:#D3DCE0;
  --teal:#0284c7; --amber:#0ea5e9;
  --display:"Bricolage Grotesque","Segoe UI",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}

header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
.brand{font:800 1.35rem/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem}
.brand i{width:14px;height:14px;background:var(--teal);border-radius:50%;display:inline-block}
.nav nav{display:flex;gap:.25rem;overflow-x:auto}
.nav nav a{padding:.5rem .8rem;border-radius:999px;font-weight:500;font-size:.95rem;color:var(--muted);white-space:nowrap}
.nav nav a:hover, .nav nav a.active{background:var(--surface);color:var(--ink)}

.hero{padding:3.5rem 0 2rem}
.hero h1{font:800 clamp(2.5rem,6vw,4rem)/1 var(--display);letter-spacing:-.03em;margin:0;color:var(--teal)}
.hero p.lead{max-width:34rem;margin:.75rem 0 0;font-size:1.15rem;color:var(--muted)}

.grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.5rem;margin:2rem 0 4rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.5rem;display:flex;flex-direction:column;gap:.5rem}
.card h3{font:700 1.3rem/1.2 var(--display);margin:0;color:var(--ink)}
.card p{margin:0;color:var(--muted);font-size:0.95rem}
.card p strong{color:var(--ink)}

footer{padding:2.5rem 0 3rem;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
</style>
</head>
<body data-category="transport">

<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><i></i>Dalkhola</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="business.html">Business</a>
      <a href="education.html">Education</a>
      <a href="services.html">Services</a>
      <a href="transport.html" class="active">Transport</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Transport & Transit</h1>
    <p class="lead">Dalkhola Railway Junction (DLK) and major road corridors (NH 12 / NH 27).</p>
  </section>

  <section id="content-list" class="grid-layout">
    <!-- Rendered dynamically from data/dalkhola.json -->
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Dalkhola City Portal</span>
    <span>Transit Information</span>
  </div>
</footer>

<script src="js/page-renderer.js"></script>
</body>
</html>
